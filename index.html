<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#12141B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="영단어를 치면 그 단어가 타워가 되는 픽셀 타워 디펜스">
<title>WORD TD</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Noto+Sans+KR:wght@400;500;700;900&family=Silkscreen:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css?v=mwyxdwkf">
<script>(function(){var b=function(e){e.preventDefault();return false;};document.addEventListener("contextmenu",b);document.addEventListener("dragstart",function(e){if(e.target&&e.target.tagName==="IMG")e.preventDefault();});
document.addEventListener("keydown",function(e){var k=(e.key||"").toUpperCase();if(k==="F12"||(e.ctrlKey||e.metaKey)&&e.shiftKey&&["I","J","C","K"].indexOf(k)>=0||(e.ctrlKey||e.metaKey)&&["U","S","P"].indexOf(k)>=0||e.metaKey&&e.altKey&&["I","J","C","U"].indexOf(k)>=0){e.preventDefault();e.stopPropagation();return false;}},true);})();</script>
</head>
<body>
<div id="screen" class="screen"></div>
<div id="battle" hidden>
  <div class="hud">
    <span class="v hp" aria-label="생명"><svg width="16" height="16" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><path d="M1 1h2v1h2V1h2v1h1v2H7v1H6v1H5v1H3V6H2V5H1V4H0V2h1z" fill="#FF5A6E"/></svg><span id="hp">20</span></span>
    <span class="v gd" aria-label="골드"><svg width="16" height="16" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><path d="M2 0h4v1h1v1h1v4H7v1H6v1H2V7H1V6H0V2h1V1h1z" fill="#FFD34D"/><path d="M3 2h2v1H4v2h1v1H3V5h1V3H3z" fill="#b8860b"/></svg><span id="gold">100</span></span>
    <div class="mid"><b id="pagel">1 / 7쪽</b><div class="bar"><i id="pageb" style="width:0"></i></div><small id="wavel">준비</small></div>
    <button class="hb wv" id="wavebtn" data-act="wave">시작 ▶</button>
    <button class="hb" id="speedbtn" data-act="speed" aria-label="속도">×1</button>
    <button class="hb" data-act="pause" aria-label="일시정지"><svg width="12" height="12" viewBox="0 0 8 8" aria-hidden="true"><path d="M1 1h2v6H1zM5 1h2v6H5z" fill="#E8EAF3"/></svg></button>
    <button class="hb" data-act="full" aria-label="전체 화면"><svg width="12" height="12" viewBox="0 0 8 8" aria-hidden="true"><path d="M0 0h3v1H1v2H0zM5 0h3v3H7V1H5zM0 5h1v2h2v1H0zM7 5h1v3H5V7h2z" fill="#E8EAF3"/></svg></button>
  </div>
  <div id="rulebar"></div>
  <div id="hint" hidden></div>
  <div class="mapwrap"><canvas id="cv" aria-label="전투 맵"></canvas>
    <div id="bossbar" hidden><span id="bossn"></span><div class="bar"><i id="bossf"></i></div></div>
    <div id="tpanel" hidden></div>
  </div>
  <div id="side"></div>
  <div id="inbar">
    <div class="modei" id="modei"><i></i><span id="model">입력</span></div>
    <div class="inmain"><input id="ti" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="16" placeholder="단어 입력 (Enter 확정)" aria-label="단어 입력"><div id="prev"></div></div>
    <div class="inside"><button id="langbtn" aria-label="한영 전환">EN</button><span id="combo"></span><span id="combom"></span><div class="ink">잉크<div class="bar"><i id="inkf" style="width:0"></i></div><span id="inkn">0</span></div></div>
  </div>
  <div class="chiprow"><div id="cands"></div><div id="spells"></div></div>
  <div id="kb" class="kb" hidden></div>
</div>
<div id="modal" hidden><div id="modalbox" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden></div><div id="banner"></div><div id="flash"></div>
<script src="game.js?v=mwyxdwkf"></script>
</body>
</html>
