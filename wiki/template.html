    while (q.length){ var p = q.shift(), d = dist[p[0] + "," + p[1]];

        if (nx < 0 || ny < 0 || nx >= w || ny >= h || k in dist) return; if (PATHLIKE.indexOf(rows[ny][nx]) < 0) return; dist[k] = d + 1; q.push([nx, ny]); }); }

}

PAGES.tutorial = {cats:["진행"], html:function(){ return "<p>스토리 없이 시스템 안내만으로 진행한다. 목표는 <b>첫 10분 안에<\/b> 플레이어가 \"아무 단어나 치면 타워가 되고, 단어에 따라 능력이 다르다\"는 재미를 직접 겪게 하는 것이다.<\/p><h2>첫 10분 목표<\/h2><div class=\"tw\"><table><thead><tr><th>목표<\/th><th>측정 기준<\/th><\/tr><\/thead><tbody><tr><td>단어를 직접 입력해 타워를 짓는다<\/td><td>타워 5기 이상 배치<\/td><\/tr><tr><td>특수 단어를 발견하는 쾌감을 느낀다<\/td><td>특수 단어 3개 이상 발견 (NEW WORD 연출)<\/td><\/tr><tr><td>원소 반응을 한 번 본다<\/td><td>증기 폭발 1회 이상<\/td><\/tr><tr><td>성장 수단을 안다<\/td><td>업그레이드 1회, 합성 안내 1회 노출<\/td><\/tr><tr><td>첫 성공을 맛본다<\/td><td>1-1, 1-2 클리어 (실패해도 계속 진행 가능)<\/td><\/tr><\/tbody><\/table><\/div><h2>첫 실행 흐름<\/h2><ol><li>타이틀 화면에서 <b>시작<\/b>을 누르면 바로 1-1 \"숲의 입구\"로 들어간다. 모드·맵 선택 화면은 1-1을 깨기 전까지 건너뛴다.<\/li><li>화면 위에 <b>건너뛰기<\/b> 버튼이 항상 있다. 누르면 튜토리얼 안내만 끄고 스테이지는 그대로 이어진다.<\/li><li>튜토리얼은 설정 → <b>튜토리얼 다시 보기<\/b>로 언제든 다시 할 수 있다.<\/li><\/ol><h2>1-1 튜토리얼 단계<\/h2><p>각 단계는 화면을 어둡게 덮고 필요한 곳만 밝게 뚫어 보여 주는 <b>스포트라이트<\/b> 방식이다. 안내 문구는 말풍선 없이 화면 아래 띠에 한두 줄로 띄운다. 조건을 만족하면 다음 단계로 자동으로 넘어간다.<\/p><div class=\"tw\"><table><thead><tr><th>단계<\/th><th>밝히는 곳<\/th><th>안내 문구<\/th><th>넘어가는 조건<\/th><\/tr><\/thead><tbody><tr><td>1. 길과 기지<\/td><td>맵의 길, 입구, 기지<\/td><td>적은 이 길을 따라 기지로 옵니다. 기지에 닿으면 생명이 줄어요.<\/td><td>화면 아무 곳이나 누르기<\/td><\/tr><tr><td>2. 첫 단어<\/td><td>화면 키보드<\/td><td>떠오르는 영단어를 입력해 보세요. 예: SUN, ICE, ROCK<\/td><td>게임 단어 입력 (첫 단어는 무료). 목록에 없으면 비슷한 단어를 제안<\/td><\/tr><tr><td>3. 판정 카드<\/td><td>입력창의 판정 카드<\/td><td>단어마다 공격력과 비용이 달라요. 희귀한 글자가 많을수록 강하고 비쌉니다.<\/td><td>확정 누르기<\/td><\/tr><tr><td>4. 배치<\/td><td>길 굽이 근처 빈칸 3곳 (초록 깜빡임)<\/td><td>길 가까이에 지으면 더 오래 공격할 수 있어요.<\/td><td>타워 배치<\/td><\/tr><tr><td>5. 첫 웨이브<\/td><td>웨이브 ▶ 버튼<\/td><td>준비되면 웨이브를 시작하세요.<\/td><td>웨이브 1 시작 (블롭 5마리, 속도 고정 ×1)<\/td><\/tr><tr><td>6. 특수 단어<\/td><td>키보드 + 입력창<\/td><td>어떤 단어는 특별한 힘이 있어요. FIRE를 입력해 보세요.<\/td><td>FIRE 배치 → NEW WORD 연출, 화상 표시<\/td><\/tr><tr><td>7. 골드<\/td><td>상단 골드<\/td><td>적을 잡으면 골드가 생겨요. 골드로 더 많은 단어를 지을 수 있어요.<\/td><td>웨이브 2 종료<\/td><\/tr><tr><td>8. 업그레이드<\/td><td>이미 지은 타워 1기<\/td><td>타워를 눌러 강화해 보세요.<\/td><td>업그레이드 1회<\/td><\/tr><tr><td>9. 원소 반응<\/td><td>입력창<\/td><td>ICE를 FIRE 근처에 지어 보세요. 불타는 적을 얼리면 터집니다.<\/td><td>증기 폭발 1회 (안 나면 웨이브 4 종료 시 넘어감)<\/td><\/tr><tr><td>10. 단어 사전<\/td><td>사전 버튼<\/td><td>아직 못 찾은 특수 단어의 첫 글자를 볼 수 있어요.<\/td><td>사전 열고 닫기<\/td><\/tr><tr><td>11. 자유 플레이<\/td><td>없음 (안내 종료)<\/td><td>이제 마음껏 단어를 지어 보세요!<\/td><td>웨이브 5~7 자유 진행<\/td><\/tr><\/tbody><\/table><\/div><h3>1-1 안전장치<\/h3><ul><li>1-1에서는 생명이 1 아래로 내려가지 않는다. 패배 없이 끝까지 진행된다.<\/li><li>안내 중인 단계(1~10)에는 다음 웨이브가 자동으로 시작되지 않는다.<\/li><li>같은 단계에서 30초 동안 아무 입력이 없으면 밝힌 곳을 한 번 더 깜빡이고, 예시 단어를 키보드 위에 흐리게 띄운다.<\/li><li>6단계에서 FIRE 대신 다른 특수 단어를 지어도 통과한다 (NEW WORD가 뜨면 성공).<\/li><\/ul><h2>상황별 1회성 팁<\/h2><p>튜토리얼이 끝난 뒤에도 처음 겪는 상황에서 한 번만 짧은 팁을 띄운다. 화면을 멈추지 않고 4초 동안 아래 띠에 보여 준다. 설정에서 끌 수 있다.<\/p><div class=\"tw\"><table><thead><tr><th>상황 (처음 한 번)<\/th><th>팁 문구<\/th><\/tr><\/thead><tbody><tr><td>게임에 없는 단어 확정<\/td><td>게임에 없는 단어예요. 아래 제안 단어를 눌러 보거나 단어 사전의 힌트를 보세요.<\/td><\/tr><tr><td>골드가 모자란 단어 입력<\/td><td>골드가 모자라요. 더 짧거나 흔한 글자로 된 단어를 써 보세요.<\/td><\/tr><tr><td>같은 단어 타워가 2기가 됨<\/td><td>같은 단어끼리 겹치면 합성돼요. Lv4부터는 합성으로만 오를 수 있어요.<\/td><\/tr><tr><td>반복 할증 발생<\/td><td>같은 단어를 또 지으면 비용이 올라요. 다른 단어도 섞어 보세요.<\/td><\/tr><tr><td>러너 첫 등장<\/td><td>빠른 적이에요. 얼음 속성이나 연사형 단어(S~Z로 시작)가 좋아요.<\/td><\/tr><tr><td>스플리터 첫 등장<\/td><td>죽으면 둘로 갈라져요. 범위 공격이 효과적이에요.<\/td><\/tr><tr><td>메딕 첫 등장<\/td><td>주변 적을 회복시켜요. 사거리가 긴 타워로 먼저 잡으세요.<\/td><\/tr><tr><td>셸 첫 등장<\/td><td>물리 피해에 단단해요. 강철·독·마법 피해가 좋아요.<\/td><\/tr><tr><td>배트 첫 등장<\/td><td>날아다녀서 길을 무시해요. 대지 속성은 못 맞혀요.<\/td><\/tr><tr><td>고스트 첫 등장<\/td><td>가끔 투명해져요. 빛 속성은 투명해도 맞힐 수 있어요.<\/td><\/tr><tr><td>첫 미니 보스<\/td><td>보스는 패턴이 있어요. 위쪽 체력바 옆 아이콘을 눌러 패턴을 확인하세요.<\/td><\/tr><tr><td>인접 공명 첫 발생<\/td><td>같은 속성끼리 붙어 있으면 공격력이 올라요.<\/td><\/tr><tr><td>생명 5 이하<\/td><td>위험해요! 기지 가까이에 타워를 더 지어 보세요.<\/td><\/tr><\/tbody><\/table><\/div><h2>초반 기능 개방 순서<\/h2><p>처음부터 모든 버튼을 보여 주지 않고, 쓸 때가 되면 하나씩 연다. 열릴 때 버튼이 반짝이며 \"새 기능\" 표시가 붙는다.<\/p><div class=\"tw\"><table><thead><tr><th>조건<\/th><th>열리는 기능<\/th><\/tr><\/thead><tbody><tr><td>처음 실행<\/td><td>단어 입력, 배치, 웨이브 시작, 일시정지<\/td><\/tr><tr><td>1-1 단계 8<\/td><td>업그레이드, 판매<\/td><\/tr><tr><td>1-1 단계 10<\/td><td>단어 사전<\/td><\/tr><tr><td>1-1 클리어<\/td><td>모드·맵·스테이지 선택 화면, 게임 속도 ×2<\/td><\/tr><tr><td>1-3 클리어<\/td><td>타겟 우선순위 설정<\/td><\/tr><tr><td>1-5 클리어<\/td><td>게임 속도 ×3<\/td><\/tr><tr><td>1-10 클리어<\/td><td>무한 모드, 성장(서재) 메뉴, 업적<\/td><\/tr><tr><td>챕터 1 보통 클리어<\/td><td>어려움 난이도<\/td><\/tr><tr><td>모든 챕터 어려움 클리어<\/td><td>지옥 난이도<\/td><\/tr><\/tbody><\/table><\/div><h2>1-1 ~ 1-4 웨이브 구성 (보통)<\/h2><p>초반 네 스테이지는 새 요소를 하나씩만 보여 주도록 손으로 짠다. 표기: 블롭 5 = 블롭 5마리, 간격 = 같은 무리 안 등장 간격(초).<\/p><div class=\"tw\"><table><thead><tr><th>스테이지<\/th><th>웨이브별 구성<\/th><th>새 요소<\/th><th>목표 시간<\/th><\/tr><\/thead><tbody><tr><td>1-1 숲의 입구 (7웨이브)<\/td><td>① 블롭 5 (1.6초) ② 블롭 7 ③ 블롭 8 ④ 블롭 10 ⑤ 블롭 8 + 블롭 4 ⑥ 블롭 14 (1.2초) ⑦ 블롭 18<\/td><td>튜토리얼<\/td><td>4~5분<\/td><\/tr><tr><td>1-2 이끼 오솔길 (8웨이브)<\/td><td>① 블롭 8 ② 블롭 6 + 러너 2 ③ 러너 6 ④ 블롭 10 ⑤ 블롭 8 + 러너 4 ⑥ 러너 10 (0.8초) ⑦ 블롭 15 ⑧ 블롭 10 + 러너 8<\/td><td>러너<\/td><td>5분<\/td><\/tr><tr><td>1-3 젤리 웅덩이 (9웨이브)<\/td><td>① 블롭 10 ② 블롭 12 ③ 러너 8 ④ 블롭 20 (0.6초, 밀집) ⑤ 블롭 10 + 러너 6 ⑥ 블롭 25 ⑦ 러너 14 ⑧ 블롭 20 + 러너 8 ⑨ 블롭 30<\/td><td>밀집 무리 → 범위 공격 유도<\/td><td>6분<\/td><\/tr><tr><td>1-4 갈라지는 덤불 (10웨이브)<\/td><td>① 블롭 10 ② 스플리터 2 ③ 블롭 12 + 스플리터 2 ④ 러너 10 ⑤ 스플리터 5 ⑥ 블롭 20 ⑦ 스플리터 4 + 러너 8 ⑧ 블롭 25 ⑨ 스플리터 8 ⑩ 블롭 20 + 스플리터 6 + 러너 10<\/td><td>스플리터<\/td><td>6~7분<\/td><\/tr><\/tbody><\/table><\/div><ul><li>웨이브 사이 대기: 보통 12초. 버튼으로 조기 호출하면 남은 1초당 1G.<\/li><li>마지막 웨이브는 한 단계 많은 수로 \"마무리 압박\"을 준다.<\/li><li>1-1~1-4는 별 3개를 받기 쉽게 설계한다 (생명 손실 없이 깨는 게 목표 가능한 수준).<\/li><\/ul><h2>로딩·대기 화면 팁<\/h2><ul><li>짧은 단어는 싸고, 긴 단어는 강하다. 둘을 섞자.<\/li><li>Q, Z, X, J, K가 들어간 단어는 치명타가 잘 터진다.<\/li><li>FIRES, FIRED처럼 특수 단어에 꼬리를 붙여도 능력이 이어진다.<\/li><li>게임에 없는 단어를 쳐도 괜찮다. 비슷한 단어를 제안해 준다.<\/li><li>같은 속성을 붙여 지으면 공명으로 공격력이 오른다.<\/li><li>불타는 적을 얼리면 증기 폭발이 일어난다.<\/li><li>도감의 실루엣과 첫 글자로 숨은 특수 단어를 추리해 보자.<\/li><\/ul>"; }};
PAGES.meta = {cats:["진행"], html:function(){ return "<p>판이 끝나도 남는 성장은 <b>가볍게<\/b> 둔다. 승부를 가르는 건 단어 지식과 배치 실력이고, 메타 성장은 \"조금 더 편해지는\" 정도로 제한한다. 모든 영구 강화를 다 찍어도 전투력 기준 약 +10% 수준이다.<\/p><h2>재화: 별<\/h2><ul><li>스테이지 별점(★1~3)이 그대로 재화가 된다. 난이도별로 따로 쌓이므로 최대 50스테이지 × 3개 × 4난이도 = <b>600개<\/b>.<\/li><li>같은 스테이지를 다시 깨서 별이 늘면 늘어난 만큼만 받는다.<\/li><li>도감 발견 보상과 업적으로도 별을 받는다.<\/li><li>별은 쓰더라도 별점 기록(진행도)은 줄지 않는다. \"보유 별\"과 \"획득 별\"을 따로 표시한다.<\/li><\/ul><h2>서재 (영구 강화)<\/h2><p>1-10 클리어 후 열린다. 책장 모양 화면에 강화 8종이 꽂혀 있고, 별을 써서 단계를 올린다. 언제든 무료로 초기화해 다시 배분할 수 있다.<\/p><div class=\"tw\"><table><thead><tr><th>강화<\/th><th>단계당 효과<\/th><th>최대<\/th><th>단계별 비용 (별)<\/th><\/tr><\/thead><tbody><tr><td>두툼한 지갑<\/td><td>시작 골드 +5%<\/td><td>5단계 (+25%)<\/td><td>3 / 6 / 9 / 12 / 15<\/td><\/tr><tr><td>튼튼한 성벽<\/td><td>생명 +1<\/td><td>3단계 (+3)<\/td><td>5 / 10 / 15<\/td><\/tr><tr><td>할인 계약<\/td><td>업그레이드 비용 −3%<\/td><td>5단계 (−15%)<\/td><td>3 / 6 / 9 / 12 / 15<\/td><\/tr><tr><td>반복의 미학<\/td><td>반복 할증 −1%p<\/td><td>5단계 (−5%p)<\/td><td>3 / 6 / 9 / 12 / 15<\/td><\/tr><tr><td>판매 수완<\/td><td>판매 환급 +4%p<\/td><td>5단계 (60% → 80%)<\/td><td>2 / 4 / 6 / 8 / 10<\/td><\/tr><tr><td>빠른 출발<\/td><td>조기 호출 보너스 +50%<\/td><td>2단계 (×2)<\/td><td>4 / 8<\/td><\/tr><tr><td>단어 감각<\/td><td>비슷한 단어 제안 +1개, 미발견 단어 힌트에 끝 글자 추가<\/td><td>2단계<\/td><td>5 / 10<\/td><\/tr><tr><td>첫 수의 여유<\/td><td>스테이지 첫 타워 건설 비용 −20%<\/td><td>3단계 (−60%)<\/td><td>4 / 8 / 12<\/td><\/tr><\/tbody><\/table><\/div><ul><li>전부 최대로 올리는 데 필요한 별: 246개 (최대 획득량 600개의 약 41%).<\/li><li><b>순수 모드<\/b>: 스테이지 시작 화면에서 켜면 서재 효과 없이 플레이한다. 무한 모드 기록은 \"일반\"과 \"순수\"를 나눠 저장한다.<\/li><\/ul><h2>도감 발견 보상<\/h2><p>특수 단어를 처음 배치하면 도감에 등록된다. 발견 수에 따라 별과 꾸밈 보상을 준다. 꾸밈은 겉모습만 바꾸고 능력에는 영향이 없다.<\/p><div class=\"tw\"><table><thead><tr><th>조건<\/th><th>보상<\/th><\/tr><\/thead><tbody><tr><td>특수 단어 25개 발견<\/td><td>별 5, 단어 띠 꾸밈 \"양피지\"<\/td><\/tr><tr><td>50개<\/td><td>별 5, 받침대 꾸밈 \"이끼 돌\"<\/td><\/tr><tr><td>100개<\/td><td>별 10, 단어 띠 꾸밈 \"금박\"<\/td><\/tr><tr><td>200개<\/td><td>별 10, 받침대 꾸밈 \"수정\"<\/td><\/tr><tr><td>270개 전부<\/td><td>별 20, 칭호 \"걸어 다니는 사전\", 단어 띠 꾸밈 \"무지개\"<\/td><\/tr><tr><td>속성 하나의 단어 전부<\/td><td>별 3, 그 속성 칭호 (예: \"불의 언어\")<\/td><\/tr><tr><td>전설 단어 1개 발견<\/td><td>전설 단어마다 고유 연출 해금 (배치 시 화면 전체 섬광)<\/td><\/tr><\/tbody><\/table><\/div><h2>업적<\/h2><div class=\"tw\"><table><thead><tr><th>업적<\/th><th>조건<\/th><th>보상<\/th><\/tr><\/thead><tbody><tr><td>첫 단어<\/td><td>타워를 처음 짓는다<\/td><td>별 1<\/td><\/tr><tr><td>단어 수집가<\/td><td>서로 다른 단어 100개 배치<\/td><td>별 3<\/td><\/tr><tr><td>장문가<\/td><td>10글자 이상 단어 배치<\/td><td>별 3, 칭호 \"장문가\"<\/td><\/tr><tr><td>희귀한 손님<\/td><td>Q가 든 단어 10번 배치<\/td><td>별 3<\/td><\/tr><tr><td>짧고 굵게<\/td><td>3글자 단어만으로 스테이지 클리어<\/td><td>별 5, 칭호 \"세 글자 장인\"<\/td><\/tr><tr><td>구두쇠<\/td><td>타워 5기 이하로 스테이지 클리어<\/td><td>별 5<\/td><\/tr><tr><td>도배 금지<\/td><td>한 스테이지에서 서로 다른 단어 15개 배치<\/td><td>별 3<\/td><\/tr><tr><td>원소 학자<\/td><td>원소 반응 7종 모두 일으키기<\/td><td>별 5, 칭호 \"원소 학자\"<\/td><\/tr><tr><td>공명<\/td><td>같은 속성 4기를 한 덩어리로 배치<\/td><td>별 2<\/td><\/tr><tr><td>완벽한 문장<\/td><td>Lv5 타워 만들기<\/td><td>별 3<\/td><\/tr><tr><td>무결점<\/td><td>★★★ 20회<\/td><td>별 5<\/td><\/tr><tr><td>챕터 정복자<\/td><td>각 챕터 10스테이지 클리어 (5개)<\/td><td>각 별 3<\/td><\/tr><tr><td>오타 장인<\/td><td>제안 단어로 타워 20기 짓기<\/td><td>별 2<\/td><\/tr><tr><td>THE END?<\/td><td>무한 모드 특별 맵의 숨은 길 공개<\/td><td>별 3, 칭호 \"끝이 아니었다\"<\/td><\/tr><tr><td>끝없는 이야기<\/td><td>무한 모드 50웨이브 도달<\/td><td>별 10, 칭호 \"끝없는 이야기\"<\/td><\/tr><tr><td>지옥의 사전<\/td><td>지옥 난이도 렉시콘 처치<\/td><td>별 20, 칭호 \"금서의 주인\"<\/td><\/tr><\/tbody><\/table><\/div><h2>칭호<\/h2><ul><li>업적과 도감 보상으로 얻는다. 하나를 골라 단다.<\/li><li>결과 화면과 무한 모드 기록 옆에 표시된다.<\/li><li>칭호 글자는 픽셀 글꼴, 등급별 색(일반 회색, 희귀 파랑, 전설 금색)이다.<\/li><\/ul><h2>해금 정리<\/h2><div class=\"tw\"><table><thead><tr><th>분류<\/th><th>해금 조건<\/th><\/tr><\/thead><tbody><tr><td>맵·스테이지<\/td><td>앞 스테이지 클리어 → 다음 스테이지, 10스테이지 클리어 → 다음 챕터<\/td><\/tr><tr><td>기능<\/td><td>튜토리얼과 초반 진행에 따라 단계적으로 열림 (튜토리얼 문서 참고)<\/td><\/tr><tr><td>난이도<\/td><td>어려움: 챕터 1 보통 클리어 / 지옥: 모든 챕터 어려움 클리어<\/td><\/tr><tr><td>무한 모드<\/td><td>1-10 클리어<\/td><\/tr><tr><td>무한 모드 특별 맵 THE END?<\/td><td>무한 모드 20웨이브 도달<\/td><\/tr><tr><td>서재<\/td><td>1-10 클리어<\/td><\/tr><tr><td>단어<\/td><td>목록 단어는 처음부터 모두 사용 가능. 해금 없음 (발견해서 도감에 등록하는 재미만)<\/td><\/tr><\/tbody><\/table><\/div><h2>저장 데이터 추가<\/h2><ul><li>보유 별, 획득 별, 서재 단계<\/li><li>업적 달성 여부와 진행도, 보유 칭호, 장착 칭호<\/li><li>꾸밈 보유와 장착<\/li><li>튜토리얼 완료 여부, 1회성 팁 노출 기록, 기능 개방 상태<\/li><li>순수 모드 기록<\/li><\/ul>"; }};

var ED = null, dbRef = null, dbUnsub = null;
function editorInit(){
  var cv = document.getElementById("edc");
  if (!ED) ED = {w:9, h:12, rows:blank(9,12), tool:"#", id:null, undo:[]};
  function blank(w,h){ var r = []; for (var j = 0; j < h; j++) r.push(new Array(w + 1).join(".")); return r; }
  function cell(){ return ED.w > 9 ? 24 : 36; }
  function draw(){ drawMap(cv, ED.rows, cell(), +document.getElementById("mch").value || 0); check(); }
  function check(){
    var v = validate(ED.rows), el = document.getElementById("vs");
    el.className = "status " + (v.ok ? "ok" : "bad");
    el.innerHTML = (v.ok ? "<b>플레이 가능한 맵입니다.</b>" : "<b>고칠 점 " + v.msgs.length + "개</b><ul>" + v.msgs.map(function(m){ return "<li>" + esc(m) + "</li>"; }).join("") + "</ul>") + '<div class="count" style="margin-top:4px">최단 경로 ' + v.len + '칸 · 빈칸 ' + v.build + '칸 · 입구 ' + v.S + '개</div>';
    return v;
  }
  function setTool(t){ ED.tool = t; [].forEach.call(document.querySelectorAll("#tools button"), function(b){ b.classList.toggle("on", b.getAttribute("data-tool") === t); }); }
  [].forEach.call(document.querySelectorAll("#tools canvas"), function(c){ drawTile(c.getContext("2d"), c.getAttribute("data-tile"), 0, 0, 14, 0); });
  document.getElementById("tools").addEventListener("click", function(e){ var b = e.target.closest("button"); if (b) setTool(b.getAttribute("data-tool")); });
  setTool(ED.tool);
  function snap(){ ED.undo.push(ED.rows.slice()); if (ED.undo.length > 60) ED.undo.shift(); }
  function paint(e){
    var r = cv.getBoundingClientRect(), i = Math.floor((e.clientX - r.left) / r.width * ED.w), j = Math.floor((e.clientY - r.top) / r.height * ED.h);
    if (i < 0 || j < 0 || i >= ED.w || j >= ED.h || ED.rows[j][i] === ED.tool) return;
    ED.rows[j] = ED.rows[j].slice(0, i) + ED.tool + ED.rows[j].slice(i + 1); draw();
  }
  var down = false, single = false;
  cv.addEventListener("pointerdown", function(e){ e.preventDefault(); cv.setPointerCapture(e.pointerId); snap(); down = true; single = "SBMO".indexOf(ED.tool) >= 0; paint(e); });
  cv.addEventListener("pointermove", function(e){ if (down && !single) paint(e); });
  cv.addEventListener("pointerup", function(){ down = false; });
  cv.addEventListener("pointercancel", function(){ down = false; });
  document.getElementById("undo").onclick = function(){ if (ED.undo.length){ ED.rows = ED.undo.pop(); draw(); } };
  var clearArm = 0;
  document.getElementById("clear").onclick = function(){ var b = this; if (Date.now() - clearArm > 3000){ clearArm = Date.now(); b.textContent = "한 번 더 누르면 비움"; setTimeout(function(){ b.textContent = "비우기"; }, 3000); return; } snap(); ED.rows = blank(ED.w, ED.h); clearArm = 0; b.textContent = "비우기"; draw(); };
  var size = document.getElementById("size"); size.value = ED.w + "x" + ED.h;
  size.onchange = function(){ var p = size.value.split("x"); snap(); ED.w = +p[0]; ED.h = +p[1]; ED.rows = blank(ED.w, ED.h); ED.id = null; draw(); toast("새 " + size.options[size.selectedIndex].text + " 맵을 시작했습니다. 되돌리기로 이전 맵을 살릴 수 있습니다."); };
  document.getElementById("preset").onchange = function(){ var k = this.value; if (!k) return; snap(); ED.rows = MAPS[k].slice(); ED.h = ED.rows.length; ED.w = ED.rows[0].length; ED.id = null; size.value = ED.w + "x" + ED.h; var num = /^\d/.test(k); document.getElementById("mch").value = num ? k[0] : "5"; document.getElementById("mname").value = (num ? CH[+k[0]-1].name + " 맵 " + k[1] : "THE END?") + " 수정본"; this.value = ""; draw(); };
  document.getElementById("mch").onchange = draw;
  function code(){ return "WTD1|" + ED.w + "x" + ED.h + "|" + ED.rows.join("/"); }
  document.getElementById("copy").onclick = function(){ var t = code(); var done = function(){ toast("맵 코드를 복사했습니다. 채팅에 붙여 넣어도 됩니다."); }; try { navigator.clipboard.writeText(t).then(done, function(){ fallbackCopy(t); }); } catch (e){ fallbackCopy(t); } };

function b64e(o){ return btoa(unescape(encodeURIComponent(JSON.stringify(o)))); }
function b64d(s){ return JSON.parse(decodeURIComponent(escape(atob(s)))); }
/* ---------- 타워 불러오기 ---------- */
function towerFromData(t){
  var kind = EL[t.kind] ? t.kind : "fire", fx = {};
  if (t.fx && typeof t.fx === "object") TE_FX.forEach(function(f){ var v = +t.fx[f[0]]; if (v > 0) fx[f[0]] = Math.min(f[4], v); });
  var x = teDefault();
  x.word = String(t.word || "").toUpperCase().replace(/[^A-Z]/g, "").slice(0, 12); x.kind = kind; x.concept = String(t.concept || "").slice(0, 300);
  x.mode = TE_MODES.some(function(m){ return m[0] === t.mode; }) ? t.mode : "single"; x.radius = Math.min(3, Math.max(0, +t.radius || 0));
  x.mult = Math.min(5, Math.max(0.1, +t.mult || 1)); x.interval = Math.min(4, Math.max(0.1, +t.interval || 1)); x.range = Math.min(7, Math.max(1, +t.range || 2));
  x.dmg = +t.dmg > 0 ? Math.min(2000, +t.dmg) : +(teBaseAtk(x) * x.mult).toFixed(1); x.dtype = ["physical","magic","true"].indexOf(t.dtype) >= 0 ? t.dtype : "physical";
  x.fx = fx; x.lv5 = String(t.lv5 || "").slice(0, 120); x.px = t.pixels ? teDecode(t.pixels) : x.px; x.color = EL[kind].m;
  return x;
}

/* ---------- 검색 ---------- */
(function(){
  var q = document.getElementById("q"), box = document.getElementById("sres"), sel = 0, res = [];
  function run(){
    var t = q.value.trim().toLowerCase(); if (!t){ box.hidden = true; return; }
    res = [];
    Object.keys(TITLES).forEach(function(id){ if (TITLES[id].toLowerCase().indexOf(t) >= 0) res.push({type:"문서", label:TITLES[id], go:function(){ location.hash = id; }}); });
    ENEMIES.forEach(function(e){ if ((e.n + e.en).toLowerCase().indexOf(t) >= 0) res.push({type:"적", label:e.n, go:function(){ location.hash = "enemies"; }}); });
    BOSSES.forEach(function(e){ if ((e.n + e.en).toLowerCase().indexOf(t) >= 0) res.push({type:"보스", label:e.n, go:function(){ location.hash = "bosses"; }}); });
    CH.forEach(function(c){ c.st.forEach(function(s, i){ if (s.toLowerCase().indexOf(t) >= 0) res.push({type:"스테이지 " + c.n + "-" + (i+1), label:s, go:function(){ location.hash = "ch" + c.n; }}); }); });
    WORDS.forEach(function(w){ if (w.w.toLowerCase().indexOf(t) === 0) res.push({type:EL[w.k].n + " 단어", label:w.w, word:1, go:function(){ towerState.q = w.w; towerState.f = "all"; if (location.hash === "#towers") render("towers"); else location.hash = "towers"; }}); });
    res = res.slice(0, 12); sel = 0; draw();
  }
  function draw(){
    box.innerHTML = ""; if (!res.length){ box.innerHTML = '<p style="padding:10px 12px;margin:0;font-size:14px">검색 결과가 없습니다.</p>'; box.hidden = false; return; }
    res.forEach(function(r, i){ var b = document.createElement("button"); var l = document.createElement("span"); l.textContent = r.label; if (r.word) l.className = "word"; var s = document.createElement("small"); s.textContent = r.type; b.appendChild(l); b.appendChild(s); if (i === sel) b.className = "on"; b.onclick = function(){ r.go(); q.value = ""; box.hidden = true; }; box.appendChild(b); });
    box.hidden = false;
  }
  q.addEventListener("input", run);
  q.addEventListener("keydown", function(e){ if (box.hidden) return; if (e.key === "ArrowDown"){ sel = Math.min(sel + 1, res.length - 1); draw(); e.preventDefault(); } else if (e.key === "ArrowUp"){ sel = Math.max(sel - 1, 0); draw(); e.preventDefault(); } else if (e.key === "Enter" && res[sel]){ res[sel].go(); q.value = ""; box.hidden = true; } else if (e.key === "Escape"){ box.hidden = true; } });
  document.addEventListener("click", function(e){ if (!e.target.closest(".search")) box.hidden = true; });
})();
